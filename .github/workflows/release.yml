name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver release version without the v prefix, for example 1.2.0'
        required: true
        default: '1.2.0'
      draft:
        description: 'Create the GitHub release as a draft'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version_name: ${{ steps.release.outputs.version_name }}
      version_code: ${{ steps.release.outputs.version_code }}
      draft: ${{ steps.release.outputs.draft }}

    steps:
      - name: Compute release names
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version_name="${{ github.event.inputs.version }}"
            tag="v${version_name#v}"
            draft="${{ github.event.inputs.draft }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
            version_name="${tag#v}"
            draft="true"
          fi

          if [[ ! "$version_name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release version must be semver-like, for example v1.2.3 or 1.2.3. Got: $tag"
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version_code=$((major * 10000 + minor * 100 + patch))

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

  android:
    name: Signed Android APKs
    runs-on: ubuntu-24.04
    needs: metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive chimahon/src/main/cpp/hoshidicts
          if [[ -n "${GH_PAT:-}" ]]; then
            git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive chimahon-local-ocr
          else
            echo "Skipping optional private chimahon-local-ocr submodule because GH_PAT is not configured."
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write optional Google client secrets
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          if [[ -n "${GOOGLE_CLIENT_SECRETS_JSON:-}" ]]; then
            printf '%s' "$GOOGLE_CLIENT_SECRETS_JSON" > app/src/main/assets/client_secrets.json
          else
            printf '{}\n' > app/src/main/assets/client_secrets.json
          fi

      - name: Clean CMake cache
        shell: bash
        run: rm -rf app/.cxx chimahon/.cxx

      - name: Build release APKs
        shell: bash
        run: |
          ./gradlew :app:assembleRelease \
            -Penable-updater \
            -Pdisable-code-shrink \
            -PreleaseVersionName=${{ needs.metadata.outputs.version_name }} \
            -PreleaseVersionCode=${{ needs.metadata.outputs.version_code }} \
            --no-daemon --console=plain --max-workers=2

      - name: Require Android signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [[ -n "${SIGNING_KEY:-}" ]] || missing+=("SIGNING_KEY")
          [[ -n "${ALIAS:-}" ]] || missing+=("ALIAS")
          [[ -n "${KEY_STORE_PASSWORD:-}" ]] || missing+=("KEY_STORE_PASSWORD")
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=("KEY_PASSWORD")

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing Android signing secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Sign APKs
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Verify signed APKs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          signed=(app/build/outputs/apk/release/*-signed.apk)
          if (( ${#signed[@]} == 0 )); then
            echo "::error::Android signing was enabled, but no signed APKs were produced."
            exit 1
          fi

          for apk in "${signed[@]}"; do
            "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$apk"
          done

      - name: Collect APK assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets

          files=(app/build/outputs/apk/release/*-signed.apk)

          if (( ${#files[@]} == 0 )); then
            echo "::error::No signed APK outputs were produced."
            exit 1
          fi

          for apk in "${files[@]}"; do
            base="$(basename "$apk")"
            abi="${base#app-}"
            abi="${abi%-release-unsigned-signed.apk}"
            abi="${abi%-release-signed.apk}"
            if [[ "$abi" == "universal" ]]; then
              name="chimahon-android-${{ needs.metadata.outputs.tag }}.apk"
            else
              name="chimahon-android-${abi}-${{ needs.metadata.outputs.tag }}.apk"
            fi
            cp "$apk" "release-assets/$name"
          done

      - name: Upload Android assets
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/*

  desktop:
    name: Desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive chimahon/src/main/cpp/hoshidicts
          if [[ -n "${GH_PAT:-}" ]]; then
            git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive chimahon-local-ocr
          else
            echo "Skipping optional private chimahon-local-ocr submodule because GH_PAT is not configured."
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows desktop installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\gradlew.bat :desktop-app:packageExe `
            '-PreleaseVersionName=${{ needs.metadata.outputs.version_name }}' `
            --no-daemon --console=plain --max-workers=2

      - name: Build Unix desktop application image
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./gradlew :desktop-app:createDistributable \
            -PreleaseVersionName=${{ needs.metadata.outputs.version_name }} \
            --no-daemon --console=plain --max-workers=2

      - name: Collect Windows desktop installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $installers = @(
            Get-ChildItem `
              -Path "desktop-app\build\compose\binaries\main\exe" `
              -Filter "*.exe" `
              -File
          )

          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows EXE installer, found $($installers.Count)."
          }

          Copy-Item `
            -LiteralPath $installers[0].FullName `
            -Destination "release-assets\chimahon-desktop-${{ matrix.platform }}-${{ needs.metadata.outputs.tag }}-installer.exe"

      - name: Package Unix desktop
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          (cd desktop-app/build/compose/binaries/main && zip -qry "../../../../../release-assets/chimahon-desktop-${{ matrix.platform }}-${{ needs.metadata.outputs.tag }}.zip" app)

      - name: Upload desktop asset
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.platform }}
          path: release-assets/*

  ios:
    name: iOS framework
    runs-on: macos-15
    needs: metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive chimahon/src/main/cpp/hoshidicts
          if [[ -n "${GH_PAT:-}" ]]; then
            git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive chimahon-local-ocr
          else
            echo "Skipping optional private chimahon-local-ocr submodule because GH_PAT is not configured."
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build iOS release frameworks
        shell: bash
        run: |
          ./gradlew \
            :shared-ui:linkReleaseFrameworkIosArm64 \
            :shared-ui:linkReleaseFrameworkIosSimulatorArm64 \
            --no-daemon --console=plain --max-workers=2

      - name: Package iOS frameworks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/ios-device release-assets/ios-simulator
          cp -R shared-ui/build/bin/iosArm64/releaseFramework/ChimahonShared.framework release-assets/ios-device/
          cp -R shared-ui/build/bin/iosSimulatorArm64/releaseFramework/ChimahonShared.framework release-assets/ios-simulator/
          (cd release-assets && zip -qry "chimahon-ios-frameworks-${{ needs.metadata.outputs.tag }}.zip" ios-device ios-simulator)
          find release-assets -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +

      - name: Upload iOS asset
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: release-assets/*

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - android
      - desktop
      - ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Chimahon ${{ needs.metadata.outputs.tag }}"
            echo
            echo "Kotlin Multiplatform release assets are attached for:"
            echo
            echo "- Android APKs"
            echo "- Windows desktop EXE installer with bundled Java runtime"
            echo "- Linux desktop application image with bundled Java runtime"
            echo "- macOS desktop x64 and arm64 application images with bundled Java runtime"
            echo "- iOS device and simulator shared frameworks"
            echo
            echo "Android APKs are signed during this workflow; the release fails if repository signing secrets are missing."
            echo
            echo "iOS app distribution still requires Apple signing/provisioning; this release includes the compiled shared iOS framework artifacts."
          } > release_notes.md

      - name: List release assets
        shell: bash
        run: find release-assets -maxdepth 2 -type f -print | sort

      - name: Remove superseded release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi

          while IFS= read -r asset; do
            if [[ -n "$asset" ]]; then
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done < <(
            gh release view "$RELEASE_TAG" \
              --json assets \
              --jq '.assets[].name | select(startswith("chimahon-desktop-windows-") and endswith(".zip"))'
          )

          shopt -s nullglob
          android_apks=(release-assets/chimahon-android-*.apk)
          signed_apks=()
          for apk in "${android_apks[@]}"; do
            if [[ "$apk" != *-unsigned.apk ]]; then
              signed_apks+=("$apk")
            fi
          done

          if (( ${#signed_apks[@]} > 0 )); then
            while IFS= read -r asset; do
              if [[ -n "$asset" ]]; then
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes
              fi
            done < <(
              gh release view "$RELEASE_TAG" \
                --json assets \
                --jq '.assets[].name | select(endswith("-unsigned.apk"))'
            )
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Chimahon ${{ needs.metadata.outputs.tag }}
          body_path: release_notes.md
          files: release-assets/*
          draft: ${{ needs.metadata.outputs.draft }}
          prerelease: false
