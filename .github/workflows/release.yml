name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver release version without the v prefix, for example 1.2.0'
        required: true
        default: '1.2.0'
      draft:
        description: 'Create the GitHub release as a draft'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version_name: ${{ steps.release.outputs.version_name }}
      version_code: ${{ steps.release.outputs.version_code }}
      draft: ${{ steps.release.outputs.draft }}

    steps:
      - name: Compute release names
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version_name="${{ github.event.inputs.version }}"
            tag="v${version_name#v}"
            draft="${{ github.event.inputs.draft }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
            version_name="${tag#v}"
            draft="true"
          fi

          if [[ ! "$version_name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release version must be semver-like, for example v1.2.3 or 1.2.3. Got: $tag"
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version_code=$((major * 10000 + minor * 100 + patch))

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

  android:
    name: Android APKs
    runs-on: ubuntu-24.04
    needs: metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive chimahon/src/main/cpp/hoshidicts
          if [[ -n "${GH_PAT:-}" ]]; then
            git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive chimahon-local-ocr
          else
            echo "Skipping optional private chimahon-local-ocr submodule because GH_PAT is not configured."
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write optional Google client secrets
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          if [[ -n "${GOOGLE_CLIENT_SECRETS_JSON:-}" ]]; then
            printf '%s' "$GOOGLE_CLIENT_SECRETS_JSON" > app/src/main/assets/client_secrets.json
          else
            printf '{}\n' > app/src/main/assets/client_secrets.json
          fi

      - name: Clean CMake cache
        shell: bash
        run: rm -rf app/.cxx chimahon/.cxx

      - name: Build release APKs
        shell: bash
        run: |
          ./gradlew :app:assembleRelease \
            -Penable-updater \
            -PreleaseVersionName=${{ needs.metadata.outputs.version_name }} \
            -PreleaseVersionCode=${{ needs.metadata.outputs.version_code }} \
            --no-daemon --console=plain --max-workers=2

      - name: Check Android signing secrets
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEY:-}" && -n "${ALIAS:-}" && -n "${KEY_STORE_PASSWORD:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign APKs
        if: steps.signing.outputs.available == 'true'
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Collect APK assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets

          signed=(app/build/outputs/apk/release/*-signed.apk)
          if (( ${#signed[@]} > 0 )); then
            files=("${signed[@]}")
            suffix=""
          else
            files=(app/build/outputs/apk/release/*-unsigned.apk)
            suffix="-unsigned"
          fi

          if (( ${#files[@]} == 0 )); then
            echo "::error::No APK outputs were produced."
            exit 1
          fi

          for apk in "${files[@]}"; do
            base="$(basename "$apk")"
            abi="${base#app-}"
            abi="${abi%-release-unsigned-signed.apk}"
            abi="${abi%-release-unsigned.apk}"
            if [[ "$abi" == "universal" ]]; then
              name="chimahon-android-${{ needs.metadata.outputs.tag }}${suffix}.apk"
            else
              name="chimahon-android-${abi}-${{ needs.metadata.outputs.tag }}${suffix}.apk"
            fi
            cp "$apk" "release-assets/$name"
          done

      - name: Upload Android assets
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/*

  desktop:
    name: Desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive chimahon/src/main/cpp/hoshidicts
          if [[ -n "${GH_PAT:-}" ]]; then
            git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive chimahon-local-ocr
          else
            echo "Skipping optional private chimahon-local-ocr submodule because GH_PAT is not configured."
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows desktop distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat :desktop-app:installDist --no-daemon --console=plain --max-workers=2

      - name: Build Unix desktop distribution
        if: runner.os != 'Windows'
        shell: bash
        run: ./gradlew :desktop-app:installDist --no-daemon --console=plain --max-workers=2

      - name: Package Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive `
            -Path "desktop-app\build\install\chimahon-desktop-smoke" `
            -DestinationPath "release-assets\chimahon-desktop-${{ matrix.platform }}-${{ needs.metadata.outputs.tag }}.zip" `
            -Force

      - name: Package Unix desktop
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          (cd desktop-app/build/install && zip -qry "../../../release-assets/chimahon-desktop-${{ matrix.platform }}-${{ needs.metadata.outputs.tag }}.zip" chimahon-desktop-smoke)

      - name: Upload desktop asset
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.platform }}
          path: release-assets/*

  ios:
    name: iOS framework
    runs-on: macos-15
    needs: metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive chimahon/src/main/cpp/hoshidicts
          if [[ -n "${GH_PAT:-}" ]]; then
            git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive chimahon-local-ocr
          else
            echo "Skipping optional private chimahon-local-ocr submodule because GH_PAT is not configured."
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build iOS release frameworks
        shell: bash
        run: |
          ./gradlew \
            :shared-ui:linkReleaseFrameworkIosArm64 \
            :shared-ui:linkReleaseFrameworkIosSimulatorArm64 \
            --no-daemon --console=plain --max-workers=2

      - name: Package iOS frameworks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/ios-device release-assets/ios-simulator
          cp -R shared-ui/build/bin/iosArm64/releaseFramework/ChimahonShared.framework release-assets/ios-device/
          cp -R shared-ui/build/bin/iosSimulatorArm64/releaseFramework/ChimahonShared.framework release-assets/ios-simulator/
          (cd release-assets && zip -qry "chimahon-ios-frameworks-${{ needs.metadata.outputs.tag }}.zip" ios-device ios-simulator)
          find release-assets -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +

      - name: Upload iOS asset
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: release-assets/*

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - android
      - desktop
      - ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Chimahon ${{ needs.metadata.outputs.tag }}"
            echo
            echo "Kotlin Multiplatform release assets are attached for:"
            echo
            echo "- Android APKs"
            echo "- Windows desktop"
            echo "- Linux desktop"
            echo "- macOS desktop x64 and arm64"
            echo "- iOS device and simulator shared frameworks"
            echo
            echo "Android APKs are signed when repository signing secrets are configured. If signing secrets are missing, unsigned APKs are still published for testing."
            echo
            echo "iOS app distribution still requires Apple signing/provisioning; this release includes the compiled shared iOS framework artifacts."
          } > release_notes.md

      - name: List release assets
        shell: bash
        run: find release-assets -maxdepth 2 -type f -print | sort

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Chimahon ${{ needs.metadata.outputs.tag }}
          body_path: release_notes.md
          files: release-assets/*
          draft: ${{ needs.metadata.outputs.draft }}
          prerelease: false
