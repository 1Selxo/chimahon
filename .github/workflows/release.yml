name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver release version without the v prefix, for example 1.2.0'
        required: true
        default: '1.2.0'
      draft:
        description: 'Create the GitHub release as a draft'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version_name: ${{ steps.release.outputs.version_name }}
      version_code: ${{ steps.release.outputs.version_code }}
      draft: ${{ steps.release.outputs.draft }}

    steps:
      - name: Compute release names
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version_name="${{ github.event.inputs.version }}"
            tag="v${version_name#v}"
            draft="${{ github.event.inputs.draft }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
            version_name="${tag#v}"
            draft="true"
          fi

          if [[ ! "$version_name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release version must be semver-like, for example v1.2.3 or 1.2.3. Got: $tag"
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version_code=$((major * 10000 + minor * 100 + patch))

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

  android:
    name: Signed Android APKs and AAB
    runs-on: ubuntu-24.04
    needs: metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive chimahon/src/main/cpp/hoshidicts
          if [[ -n "${GH_PAT:-}" ]]; then
            git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive chimahon-local-ocr
          else
            echo "Skipping optional private chimahon-local-ocr submodule because GH_PAT is not configured."
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write optional Google client secrets
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          if [[ -n "${GOOGLE_CLIENT_SECRETS_JSON:-}" ]]; then
            printf '%s' "$GOOGLE_CLIENT_SECRETS_JSON" > app/src/main/assets/client_secrets.json
          else
            printf '{}\n' > app/src/main/assets/client_secrets.json
          fi

      - name: Clean CMake cache
        shell: bash
        run: rm -rf app/.cxx chimahon/.cxx

      - name: Build Android release artifacts
        shell: bash
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -Penable-updater \
            -Pdisable-code-shrink \
            -PreleaseVersionName=${{ needs.metadata.outputs.version_name }} \
            -PreleaseVersionCode=${{ needs.metadata.outputs.version_code }} \
            --no-daemon --console=plain --max-workers=2

      - name: Require Android signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [[ -n "${SIGNING_KEY:-}" ]] || missing+=("SIGNING_KEY")
          [[ -n "${ALIAS:-}" ]] || missing+=("ALIAS")
          [[ -n "${KEY_STORE_PASSWORD:-}" ]] || missing+=("KEY_STORE_PASSWORD")
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=("KEY_PASSWORD")

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing Android signing secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Sign Android release artifacts
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [[ -z "$build_tools" || ! -x "$build_tools/apksigner" ]]; then
            echo "::error::Unable to locate Android apksigner."
            exit 1
          fi

          keystore="$RUNNER_TEMP/chimahon-release.jks"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$keystore"

          mkdir -p app/build/outputs/apk/release/signed
          mkdir -p app/build/outputs/bundle/release/signed

          apks=(app/build/outputs/apk/release/*-release-unsigned.apk)
          if (( ${#apks[@]} == 0 )); then
            apks=(app/build/outputs/apk/release/*-release.apk)
          fi
          aabs=(app/build/outputs/bundle/release/*.aab)

          if (( ${#apks[@]} == 0 )); then
            echo "::error::No release APKs were produced to sign."
            exit 1
          fi
          if (( ${#aabs[@]} == 0 )); then
            echo "::error::No release AAB was produced to sign."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            base="$(basename "$apk")"
            if [[ "$base" == *debug* || "$base" == *Debug* ]]; then
              echo "::error::Refusing to sign non-release APK: $base"
              exit 1
            fi

            signed_base="${base%-unsigned.apk}"
            if [[ "$signed_base" == "$base" ]]; then
              signed_base="${base%.apk}"
            fi
            signed_apk="app/build/outputs/apk/release/signed/${signed_base}-signed.apk"

            "$build_tools/apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$KEY_STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$signed_apk" \
              "$apk"
          done

          for aab in "${aabs[@]}"; do
            base="$(basename "$aab")"
            if [[ "$base" == *debug* || "$base" == *Debug* ]]; then
              echo "::error::Refusing to sign non-release AAB: $base"
              exit 1
            fi

            signed_base="${base%-unsigned.aab}"
            if [[ "$signed_base" == "$base" ]]; then
              signed_base="${base%.aab}"
            fi

            jarsigner \
              -keystore "$keystore" \
              -storepass "$KEY_STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -signedjar "app/build/outputs/bundle/release/signed/${signed_base}-signed.aab" \
              "$aab" \
              "$ALIAS"
          done

      - name: Verify signed Android release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          signed_apks=(app/build/outputs/apk/release/signed/*.apk)
          signed_aabs=(app/build/outputs/bundle/release/signed/*.aab)

          if (( ${#signed_apks[@]} == 0 )); then
            echo "::error::Android signing was enabled, but no signed APKs were produced."
            exit 1
          fi
          if (( ${#signed_aabs[@]} == 0 )); then
            echo "::error::Android signing was enabled, but no signed AAB was produced."
            exit 1
          fi

          for apk in "${signed_apks[@]}"; do
            if [[ "$(basename "$apk")" == *unsigned* ]]; then
              echo "::error::Refusing to verify an unsigned-labeled APK as release-signed: $apk"
              exit 1
            fi
            "$build_tools/apksigner" verify --verbose "$apk"
          done

          for aab in "${signed_aabs[@]}"; do
            if [[ "$(basename "$aab")" == *unsigned* ]]; then
              echo "::error::Refusing to verify an unsigned-labeled AAB as release-signed: $aab"
              exit 1
            fi
            jarsigner -verify "$aab"
          done

      - name: Collect Android release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets

          signed_apks=(app/build/outputs/apk/release/signed/*.apk)
          signed_aabs=(app/build/outputs/bundle/release/signed/*.aab)

          if (( ${#signed_apks[@]} == 0 )); then
            echo "::error::No signed APK outputs were produced."
            exit 1
          fi
          if (( ${#signed_aabs[@]} != 1 )); then
            echo "::error::Expected exactly one signed AAB output, found ${#signed_aabs[@]}."
            exit 1
          fi
          if [[ "$(basename "${signed_aabs[0]}")" == *unsigned* ]]; then
            echo "::error::Refusing to collect unsigned-labeled AAB as a release asset: ${signed_aabs[0]}"
            exit 1
          fi

          for apk in "${signed_apks[@]}"; do
            base="$(basename "$apk")"
            if [[ "$base" == *unsigned* ]]; then
              echo "::error::Refusing to collect unsigned-labeled APK as a release asset: $base"
              exit 1
            fi

            abi="${base%.apk}"
            abi="${abi%-signed}"
            abi="${abi%-release}"
            abi="${abi#app-}"
            if [[ "$abi" == "app" || "$abi" == "universal" ]]; then
              name="chimahon-android-${{ needs.metadata.outputs.tag }}.apk"
            else
              name="chimahon-android-${abi}-${{ needs.metadata.outputs.tag }}.apk"
            fi
            cp "$apk" "release-assets/$name"
          done

          cp "${signed_aabs[0]}" "release-assets/chimahon-android-${{ needs.metadata.outputs.tag }}.aab"

      - name: Upload Android assets
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/*

  desktop:
    name: Desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive chimahon/src/main/cpp/hoshidicts
          if [[ -n "${GH_PAT:-}" ]]; then
            git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive chimahon-local-ocr
          else
            echo "Skipping optional private chimahon-local-ocr submodule because GH_PAT is not configured."
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows desktop installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\gradlew.bat :desktop-app:createDistributable :desktop-app:packageExe :desktop-app:packageMsi `
            '-PreleaseVersionName=${{ needs.metadata.outputs.version_name }}' `
            '-PreleaseBuildNumber=${{ needs.metadata.outputs.version_code }}' `
            --no-daemon --console=plain --max-workers=2

      - name: Verify Windows bundled runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $appImageRoot = "desktop-app\build\compose\binaries\main\app"
          if (-not (Test-Path -LiteralPath $appImageRoot)) {
            throw "Expected Compose Desktop app image at $appImageRoot."
          }

          $launcher = Get-ChildItem `
            -Path $appImageRoot `
            -Filter "Chimahon.exe" `
            -File `
            -Recurse |
            Where-Object { $_.FullName -notmatch '\\runtime\\' } |
            Select-Object -First 1

          if (-not $launcher) {
            throw "Windows app image did not contain a Chimahon.exe launcher."
          }

          $runtimeDir = Get-ChildItem `
            -Path $appImageRoot `
            -Directory `
            -Recurse |
            Where-Object { $_.Name -eq "runtime" } |
            Select-Object -First 1

          if (-not $runtimeDir) {
            throw "Windows app image did not contain a bundled runtime directory."
          }

          $runtimeMarker = Get-ChildItem `
            -Path $runtimeDir.FullName `
            -File `
            -Recurse |
            Where-Object {
              $_.Name -eq "release" -or
              $_.FullName -match '\\bin\\server\\jvm\.dll$' -or
              $_.FullName -match '\\bin\\jvm\.dll$'
            } |
            Select-Object -First 1

          if (-not $runtimeMarker) {
            throw "Windows bundled runtime did not contain expected JVM metadata or binaries."
          }

          Write-Host "Found Windows launcher: $($launcher.FullName)"
          Write-Host "Found bundled runtime: $($runtimeDir.FullName)"
          Write-Host "Found runtime marker: $($runtimeMarker.FullName)"

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Build Linux desktop packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./gradlew :desktop-app:packageDeb :desktop-app:packageRpm \
            -PreleaseVersionName=${{ needs.metadata.outputs.version_name }} \
            -PreleaseBuildNumber=${{ needs.metadata.outputs.version_code }} \
            --no-daemon --console=plain --max-workers=2

      - name: Build macOS desktop disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./gradlew :desktop-app:packageDmg \
            -PreleaseVersionName=${{ needs.metadata.outputs.version_name }} \
            -PreleaseBuildNumber=${{ needs.metadata.outputs.version_code }} \
            --no-daemon --console=plain --max-workers=2

      - name: Collect Windows desktop installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $assets = @(
            @{
              Path = "desktop-app\build\compose\binaries\main\exe"
              Filter = "*.exe"
              Suffix = "installer.exe"
            },
            @{
              Path = "desktop-app\build\compose\binaries\main\msi"
              Filter = "*.msi"
              Suffix = "installer.msi"
            }
          )

          foreach ($asset in $assets) {
            $installers = @(
              Get-ChildItem `
                -Path $asset.Path `
                -Filter $asset.Filter `
                -File
            )

            if ($installers.Count -ne 1) {
              throw "Expected exactly one Windows $($asset.Filter) installer, found $($installers.Count)."
            }

            Copy-Item `
              -LiteralPath $installers[0].FullName `
              -Destination "release-assets\chimahon-desktop-${{ matrix.platform }}-${{ needs.metadata.outputs.tag }}-$($asset.Suffix)"
          }

      - name: Collect Linux desktop packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets

          debs=(desktop-app/build/compose/binaries/main/deb/*.deb)
          rpms=(desktop-app/build/compose/binaries/main/rpm/*.rpm)

          if (( ${#debs[@]} != 1 )); then
            echo "::error::Expected exactly one Linux DEB package, found ${#debs[@]}."
            exit 1
          fi

          if (( ${#rpms[@]} != 1 )); then
            echo "::error::Expected exactly one Linux RPM package, found ${#rpms[@]}."
            exit 1
          fi

          cp "${debs[0]}" "release-assets/chimahon-desktop-${{ matrix.platform }}-${{ needs.metadata.outputs.tag }}.deb"
          cp "${rpms[0]}" "release-assets/chimahon-desktop-${{ matrix.platform }}-${{ needs.metadata.outputs.tag }}.rpm"

      - name: Collect macOS desktop disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets

          dmgs=(desktop-app/build/compose/binaries/main/dmg/*.dmg)

          if (( ${#dmgs[@]} != 1 )); then
            echo "::error::Expected exactly one macOS DMG package, found ${#dmgs[@]}."
            exit 1
          fi

          cp "${dmgs[0]}" "release-assets/chimahon-desktop-${{ matrix.platform }}-${{ needs.metadata.outputs.tag }}.dmg"

      - name: Upload desktop asset
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.platform }}
          path: release-assets/*

  ios:
    name: iOS framework
    runs-on: macos-15
    needs: metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive chimahon/src/main/cpp/hoshidicts
          if [[ -n "${GH_PAT:-}" ]]; then
            git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive chimahon-local-ocr
          else
            echo "Skipping optional private chimahon-local-ocr submodule because GH_PAT is not configured."
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build iOS release frameworks
        shell: bash
        run: |
          ./gradlew \
            :shared-ui:linkReleaseFrameworkIosArm64 \
            :shared-ui:linkReleaseFrameworkIosSimulatorArm64 \
            --no-daemon --console=plain --max-workers=2

      - name: Package iOS frameworks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/ios-device release-assets/ios-simulator
          cp -R shared-ui/build/bin/iosArm64/releaseFramework/ChimahonShared.framework release-assets/ios-device/
          cp -R shared-ui/build/bin/iosSimulatorArm64/releaseFramework/ChimahonShared.framework release-assets/ios-simulator/
          (cd release-assets && zip -qry "chimahon-ios-frameworks-${{ needs.metadata.outputs.tag }}.zip" ios-device ios-simulator)
          find release-assets -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +

      - name: Upload iOS asset
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: release-assets/*

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - android
      - desktop
      - ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Chimahon ${{ needs.metadata.outputs.tag }}"
            echo
            echo "Kotlin Multiplatform release assets are attached for:"
            echo
            echo "- Android APKs and AAB"
            echo "- Windows desktop EXE and MSI installers with bundled Java runtime"
            echo "- Linux desktop DEB and RPM packages with bundled Java runtime"
            echo "- macOS desktop x64 and arm64 DMG packages with bundled Java runtime"
            echo "- iOS device and simulator shared frameworks"
            echo
            echo "Android APKs and the AAB are signed during this workflow; the release fails if repository signing secrets are missing."
            echo
            echo "iOS app distribution still requires Apple signing/provisioning; this release includes the compiled shared iOS framework artifacts."
          } > release_notes.md

      - name: List release assets
        shell: bash
        run: find release-assets -maxdepth 2 -type f -print | sort

      - name: Remove superseded release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi

          while IFS= read -r asset; do
            if [[ -n "$asset" ]]; then
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done < <(
            gh release view "$RELEASE_TAG" \
              --json assets \
              --jq '.assets[].name | select(startswith("chimahon-desktop-") and endswith(".zip"))'
          )

          shopt -s nullglob
          android_artifacts=(release-assets/chimahon-android-*.apk release-assets/chimahon-android-*.aab)
          signed_android_artifacts=()
          for artifact in "${android_artifacts[@]}"; do
            if [[ "$artifact" != *-unsigned.apk && "$artifact" != *-unsigned.aab ]]; then
              signed_android_artifacts+=("$artifact")
            fi
          done

          if (( ${#signed_android_artifacts[@]} > 0 )); then
            while IFS= read -r asset; do
              if [[ -n "$asset" ]]; then
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes
              fi
            done < <(
              gh release view "$RELEASE_TAG" \
                --json assets \
                --jq '.assets[].name | select(startswith("chimahon-android-") and (endswith("-unsigned.apk") or endswith("-unsigned.aab")))'
            )
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Chimahon ${{ needs.metadata.outputs.tag }}
          body_path: release_notes.md
          files: release-assets/*
          draft: ${{ needs.metadata.outputs.draft }}
          prerelease: false
